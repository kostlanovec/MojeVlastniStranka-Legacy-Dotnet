services:
  mojevlastnistranka.web:
    image: kostlanovec/mojevlastnistranka:latest
    pull_policy: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - APP_UID=1000
      - SELF_BASE_URL=https://kostlanovec.cz
    expose:
      - "8080"
    user: "1000:1000"
    volumes:
     - /var/uploads/user-uploads:/app/wwwroot/user-uploads:rw
  db:
    image: postgres:17.2
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: [REDACTED]
      POSTGRES_USERNAME: postgres
    volumes:
      - local_postgres_data:/var/lib/postgresql/data

networks:
  monitoring:
    external: true

volumes:
  local_postgres_data: {}